[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "papertrail"
version = "0.1.0"
description = "Multi-domain document intake with vision LLMs: extraction, validation and cross-document checks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Swasti Jain", email = "swastiworkspace@gmail.com" }]
dependencies = [
    "groq==1.7.0",
    "pydantic==2.13.5",
    "pillow==12.3.0",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    "rapidfuzz==3.14.6",
    "pypdfium2==5.14.0",
]

[project.optional-dependencies]
ocr = ["pytesseract==0.3.13"]
bench = ["faker==40.41.0", "matplotlib==3.11.2", "pytesseract==0.3.13"]
dev = ["pytest==9.1.1", "ruff==0.16.10", "pytesseract==0.3.13", "faker==40.41.0", "matplotlib==3.11.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/papertrail"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
